name: 設定の確認
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 確認（投稿はしません）
        env:
          # 事業を足したら、ここにその事業のトークンを1行ずつ足す（Claudeがやります）
          IG_TOKEN_LUA: ${{ secrets.IG_TOKEN_LUA }}
          THREADS_TOKEN_LUA: ${{ secrets.THREADS_TOKEN_LUA }}
          IG_TOKEN_UMATARO: ${{ secrets.IG_TOKEN_UMATARO }}
          THREADS_TOKEN_UMATARO: ${{ secrets.THREADS_TOKEN_UMATARO }}
          THREADS_TOKEN_INSHOKU: ${{ secrets.THREADS_TOKEN_INSHOKU }}
          DISCORD_BOT_TOKEN_UMATARO: ${{ secrets.DISCORD_BOT_TOKEN_UMATARO }}
          # 倶楽部の部屋ごとのウェブフック（ボットがあればボットを優先）。🏁コース解説は10/14からの MAIN も使う
          DISCORD_WEBHOOK_UMATARO_NEWS: ${{ secrets.DISCORD_WEBHOOK_UMATARO_NEWS }}
          DISCORD_WEBHOOK_UMATARO_YOSO: ${{ secrets.DISCORD_WEBHOOK_UMATARO_YOSO }}
          DISCORD_WEBHOOK_UMATARO_ZENTO: ${{ secrets.DISCORD_WEBHOOK_UMATARO_ZENTO }}
          DISCORD_WEBHOOK_UMATARO_BIAS: ${{ secrets.DISCORD_WEBHOOK_UMATARO_BIAS }}
          DISCORD_WEBHOOK_UMATARO_COURSE: ${{ secrets.DISCORD_WEBHOOK_UMATARO_COURSE || secrets.DISCORD_WEBHOOK_UMATARO_MAIN }}
          DISCORD_WEBHOOK_UMATARO_BAKEN: ${{ secrets.DISCORD_WEBHOOK_UMATARO_BAKEN }}
          DISCORD_WEBHOOK_UMATARO_KAIKO: ${{ secrets.DISCORD_WEBHOOK_UMATARO_KAIKO }}
          DISCORD_WEBHOOK_UMATARO_HAJIME: ${{ secrets.DISCORD_WEBHOOK_UMATARO_HAJIME }}
          DISCORD_WEBHOOK_UMATARO_JIKO: ${{ secrets.DISCORD_WEBHOOK_UMATARO_JIKO }}
          DISCORD_WEBHOOK_UMATARO_TAIKAI: ${{ secrets.DISCORD_WEBHOOK_UMATARO_TAIKAI }}
          DISCORD_WEBHOOK_UMATARO_SHITSUMON: ${{ secrets.DISCORD_WEBHOOK_UMATARO_SHITSUMON }}
          DISCORD_WEBHOOK_UMATARO_MINNA: ${{ secrets.DISCORD_WEBHOOK_UMATARO_MINNA }}
          DISCORD_WEBHOOK_UMATARO_ZATSUDAN: ${{ secrets.DISCORD_WEBHOOK_UMATARO_ZATSUDAN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/check.py
