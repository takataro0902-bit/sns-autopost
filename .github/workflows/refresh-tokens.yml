name: トークン延長
on:
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 延長してSecretsに保存
        env:
          # 事業を足したら、ここにその事業のトークンを1行ずつ足す（Claudeがやります）
          IG_TOKEN_LUA: ${{ secrets.IG_TOKEN_LUA }}
          THREADS_TOKEN_LUA: ${{ secrets.THREADS_TOKEN_LUA }}
          IG_TOKEN_UMATARO: ${{ secrets.IG_TOKEN_UMATARO }}
          THREADS_TOKEN_UMATARO: ${{ secrets.THREADS_TOKEN_UMATARO }}
          THREADS_TOKEN_INSHOKU: ${{ secrets.THREADS_TOKEN_INSHOKU }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}   # Threadsの短期トークンを長期に交換するときに使う
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/refresh_tokens.py
