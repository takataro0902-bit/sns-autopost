name: 他アカウントの投稿を調べる
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".research-request.json", "scripts/research.py"]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 検索して読む（投稿はしません）
        env:
          THREADS_TOKEN_UMATARO: ${{ secrets.THREADS_TOKEN_UMATARO }}
        run: python3 scripts/research.py
      - name: 結果を記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          [ -d research/ ] || exit 0
          git add research/
          git diff --cached --quiet && exit 0
          git commit -m "調べた投稿を記録"
          git pull --rebase -q origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
